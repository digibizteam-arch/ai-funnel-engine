<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
 <title>Your Funnel Preview — Maria Angelica Scott</title>
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
 <style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'DM Sans',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;overflow-x:hidden}

 /* Demo Bar - UNCHANGED */
 .demo-bar{position:fixed;top:0;left:0;right:0;z-index:10000;background:rgba(13,13,13,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(184,149,106,0.3);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
 .demo-left{display:flex;align-items:center;gap:10px;min-width:0}
 .demo-badge{background:#B8956A;color:#fff;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:100px;white-space:nowrap;flex-shrink:0}
 .demo-label{font-size:0.78rem;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 /* Pulsing CTA - UNCHANGED */
 .demo-cta-top {
   background: linear-gradient(135deg, #C9A84C, #B8956A);
   color: #fff !important;
   border: 2px solid rgba(255,255,255,0.2);
   font-family: 'DM Sans', sans-serif;
   font-size: 0.82rem;
   font-weight: 700;
   padding: 10px 20px;
   border-radius: 100px;
   cursor: pointer;
   text-decoration: none;
   display: inline-flex;
   align-items: center;
   gap: 6px;
   white-space: nowrap;
   flex-shrink: 0;
   position: relative;
   letter-spacing: 0.01em;
   animation: ctaPulse 1.8s ease-in-out infinite;
 }
 /* ... rest of CTA animations unchanged ... */

 /* Loading/Error - FIXED HEIGHT FOR FULL SCREEN DEMO */
 #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;text-align:center;padding-top:80px}
 .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,0.08);border-top-color:#B8956A;border-radius:50%;animation:spin 0.9s linear infinite}
 #error-state{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;text-align:center;padding:24px;padding-top:80px}
 #preview-wrap{display:none;min-height:100vh;padding-top:52px;overflow-y:auto}
 #preview-frame{width:100%;min-height:100vh;border:none;display:block}
 @keyframes spin{to{transform:rotate(360deg)}}

 /* FIXED NEW SECTIONS - DARK TEXT ON LIGHT BG */
 .container{max-width:1280px;margin:0 auto;padding:0 1rem}
 .py-16{padding:4rem 0}
 .next-steps{background:#fff;color:#1f2937 !important} /* Dark gray text */
 .next-steps-content{text-align:center;max-width:48rem;margin:0 auto}
 .eyebrow{font-size:0.875rem;color:#8B5CF6 !important;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;display:block;margin-bottom:0.75rem}
 .text-3xl{font-size:1.875rem;line-height:2.25rem;color:#111 !important}
 .md\:text-4xl{font-size:2.25rem;line-height:2.5rem}
 .lg\:text-5xl{font-size:3rem;line-height:1}
 .font-bold{font-weight:700}
 .mt-3{margin-top:0.75rem}
 .mb-6{margin-bottom:1.5rem}
 .leading-tight{line-height:1.2}
 .lead{font-size:1.125rem;line-height:1.75rem;color:#6B7280 !important;max-width:32rem;margin:0 auto 1.5rem}
 .steps-grid{display:grid;grid-template-columns:1fr;gap:1.5rem;margin-top:3rem}
 .md\:grid-cols-3{grid-template-columns:repeat(3,1fr)}
 .step-card{background:#fff !important;border:1px solid #f3f4f6 !important;border-radius:1rem;padding:2rem;color:#374151 !important;font-size:0.875rem;transition:box-shadow 0.2s}
 .step-card:hover{box-shadow:0 10px 25px rgba(0,0,0,0.1)}
 .text-xl{font-size:1.25rem;color:#111 !important}
 .mb-3{margin-bottom:0.75rem}
 .text-gray-600{color:#6B7280 !important}
 .cta-panel{margin-top:4rem;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1px solid #e9d5ff;border-radius:1.5rem;padding:2rem;color:#374151 !important}
 .md\:p-12{padding:3rem}
 .text-2xl{font-size:1.5rem;color:#111 !important}
 .mb-4{margin-bottom:1rem}
 .mb-8{margin-bottom:2rem}
 .text-lg{font-size:1.125rem;color:#6B7280 !important}
 .primary-btn{background:#7C3AED !important;border-radius:1rem;color:#fff !important;font-weight:600;padding:1rem 2.5rem;font-size:1.125rem;display:inline-block;text-decoration:none;transition:all 0.2s;min-width:280px;box-shadow:0 4px 14px rgba(124,58,237,0.3)}
 .primary-btn:hover{background:#6D28D9 !important;transform:translateY(-1px);box-shadow:0 10px 25px rgba(124,58,237,0.4)}
 .small-note{font-size:0.75rem;color:#9CA3AF !important;margin-top:2rem;max-width:20rem;margin-left:auto;margin-right:auto}
 
 /* OTHER SECTIONS - FIXED TEXT COLORS */
 .testimonial{background:#f9fafb !important;color:#1f2937 !important;padding:4rem 0}
 .testimonial h2,.testimonial h3{color:#111 !important}
 .testimonial .lead,.testimonial .text-gray-600{color:#6B7280 !important}
 .about{background:#fff !important;color:#1f2937 !important;padding:4rem 0}
 .about h2,.about h3{color:#111 !important}
 .about .lead,.about p{color:#6B7280 !important}
 
 /* Mobile Responsive */
 @media (max-width: 768px) {
   .container{padding:0 1rem}
   .py-16{padding:2.5rem 0}
   .text-3xl{font-size:1.5rem}
   .primary-btn{width:100%;max-width:100%;padding:1rem 1.75rem;font-size:1rem;text-align:center;box-sizing:border-box}
   #preview-frame{min-height:80vh}
 }
 </style>
</head>
<body>

 <!-- UNCHANGED TOP -->
 <div class="demo-bar">...</div>

 <!-- FULL SCREEN DEMO FIRST - USER MUST SCROLL DOWN -->
 <div id="loading">...</div>
 <div id="error-state">...</div>
 <div id="preview-wrap">
  <iframe id="preview-frame" title="Your Funnel Preview" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
 </div>

 <!-- NEW SECTIONS - BELOW FULLSCREEN IFRAME -->
 <section class="next-steps py-16 bg-white">...</section>
 <section class="testimonial py-16 bg-gray-50" id="next-step">...</section>
 <section class="about py-16">...</section>

 <!-- UNCHANGED JS -->
 <script>...</script>
</body>
</html>
