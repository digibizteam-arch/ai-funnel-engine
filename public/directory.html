<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trusted Advisor Match PH — Find Your Licensed Financial Advisor</title>
  <style>
    :root {
      --navy: #0f172a;
      --slate: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --blue: #1d4ed8;
      --blue-soft: #eff6ff;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--navy);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; color: var(--navy); }
    .brand span { color: var(--blue); }
    .trust-pill {
      font-size: 12px; font-weight: 600; color: var(--emerald);
      background: var(--emerald-soft); padding: 5px 10px; border-radius: 999px;
    }
    .hero { text-align: center; margin-bottom: 28px; }
    .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 8px; }
    .hero p { color: var(--slate); font-size: 15px; max-width: 580px; margin: 0 auto; }

    /* Quiz Card */
    .quiz-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px rgba(15,23,42,0.04);
    }
    .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .progress-bar { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
    .progress-fill { height: 100%; background: var(--blue); width: 25%; transition: width 0.25s ease; }
    .q-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .q-sub { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
    .options { display: grid; gap: 10px; }
    .opt-btn {
      width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--border);
      border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 600;
      color: var(--navy); cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; justify-content: space-between;
    }
    .opt-btn:hover { border-color: var(--blue); background: var(--blue-soft); }
    .opt-btn small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .nav-row { display: flex; justify-content: space-between; margin-top: 18px; }
    .ghost-btn {
      background: none; border: none; color: var(--muted); font-size: 14px;
      font-weight: 600; cursor: pointer; padding: 6px 4px;
    }
    .ghost-btn:hover { color: var(--navy); }

    /* Results */
    .hidden { display: none !important; }
    .results-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 18px;
    }
    .results-head h2 { font-size: 21px; font-weight: 800; }
    .advisor-list { display: grid; gap: 16px; }
    .adv-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 20px; transition: border-color 0.15s ease;
    }
    .adv-card.top-pick { border-color: #93c5fd; box-shadow: 0 6px 24px rgba(29,78,216,0.07); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge-rec { background: var(--blue-soft); color: var(--blue); }
    .badge-ver { background: var(--emerald-soft); color: var(--emerald); }
    .adv-main { display: flex; gap: 14px; align-items: flex-start; }
    .avatar {
      width: 56px; height: 56px; border-radius: 14px; background: #dbeafe;
      color: var(--blue); font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .adv-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    .adv-role { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .adv-bio { font-size: 14px; color: var(--slate); margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag {
      font-size: 12px; background: #f1f5f9; color: var(--slate);
      padding: 4px 10px; border-radius: 8px; font-weight: 500;
    }
    .card-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn-primary {
      background: var(--navy); color: #fff; border: none; border-radius: 12px;
      padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary:hover { background: #1e293b; }
    .btn-secondary {
      background: var(--blue-soft); color: var(--blue); border: 1px solid #bfdbfe;
      border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 700;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    }

    /* Popup Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 1000;
    }
    .modal-box {
      background: #fff; border-radius: 22px; max-width: 520px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
      box-shadow: 0 20px 50px rgba(15,23,42,0.22);
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 34px; height: 34px;
      border-radius: 999px; border: 1px solid var(--border); background: #f8fafc;
      font-size: 18px; cursor: pointer; color: var(--slate);
    }
    .modal-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .modal-section h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
    .cta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .cta-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
      text-decoration: none; border: 1px solid var(--border); color: var(--navy); background: #f8fafc;
    }
    .cta-link:hover { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .cta-calc {
      grid-column: 1 / -1; background: var(--blue); color: #fff; border: none;
      padding: 14px; font-size: 14px;
    }
    .cta-calc:hover { background: #1e40af; color: #fff; }
    @media (max-width: 540px) {
      .hero h1 { font-size: 23px; }
      .cta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Trusted Advisor <span>Match PH</span></div>
      <div class="trust-pill">✓ Verified PH Advisors</div>
    </div>

    <div class="hero">
      <h1>Find the Right Financial Advisor for Your Family</h1>
      <p>Sagutin ang 4 quick questions para ma-match ka sa licensed advisor na tugma sa priority, budget, at setup mo—walang pilitan.</p>
    </div>

    <!-- 4-Question Matching Quiz -->
    <div id="quiz-box" class="quiz-card">
      <div class="progress-row">
        <span id="step-label">Question 1 of 4</span>
        <span id="step-pct">25%</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <h2 id="q-title" class="q-title"></h2>
      <p id="q-sub" class="q-sub"></p>
      <div id="options-box" class="options"></div>
      <div class="nav-row">
        <button id="back-btn" class="ghost-btn hidden" type="button">← Back</button>
        <button id="skip-btn" class="ghost-btn" type="button">Browse all advisors →</button>
      </div>
    </div>

    <!-- Matched Advisors Results -->
    <div id="results-box" class="hidden">
      <div class="results-head">
        <div>
          <h2>Your Top Advisor Matches</h2>
          <p id="match-summary" style="font-size:14px;color:var(--muted);"></p>
        </div>
        <button id="retake-btn" class="ghost-btn" type="button">↻ Retake 4-Question Match</button>
      </div>
      <div id="advisor-list" class="advisor-list"></div>
    </div>
  </div>

  <!-- Advisor Profile Popup Modal (Used when standalone DashNex profileUrl is not set yet) -->
  <div id="profile-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ADVISOR DIRECTORY ROSTER
    // Leave profileUrl: "" to open the built-in popup modal (Viber, WhatsApp,
    // Messenger + Safety Net Calculator). Once an advisor's DashNex page is live,
    // paste their URL into profileUrl and clicking their card redirects there!
    // =========================================================================
    const ADVISORS = [
      {
        slug: "angela-santos",
        initials: "AS",
        name: "Angela Santos",
        role: "Licensed Financial Advisor • Family & Health Protection",
        verified: true,
        recommended: true,
        priorityScore: 98,
        specialties: ["income-protection", "health-hmo", "education"],
        clientTypes: ["breadwinner", "parents", "ofw"],
        style: "educational",
        bio: "Helps Filipino breadwinners and young parents build realistic health and income protection without straining monthly household cashflow.",
        credentials: "IC-Licensed Advisor • 6+ Years Experience • Metro Manila & Online Nationwide",
        profileUrl: "", // Paste DashNex URL here once ready (e.g. "https://your-dashnex.com/angela-santos")
        viberUrl: "viber://chat?number=%2B639170000001",
        whatsappUrl: "https://wa.me/639170000001",
        messengerUrl: "https://m.me/",
        bookingUrl: "https://calendly.com/"
      },
      {
        slug: "marco-reyes",
        initials: "MR",
        name: "Marco Reyes",
        role: "Wealth & Estate Planning Specialist",
        verified: true,
        recommended: true,
        priorityScore: 92,
        specialties: ["estate-tax", "income-protection", "retirement"],
        clientTypes: ["business-owner", "ofw", "breadwinner"],
        style: "analytical",
        bio: "Specializes in TRAIN Law 6% estate tax liquidity, business continuity, and asset protection for Filipino families and OFW investors.",
        credentials: "IC-Licensed Advisor • Estate & Business Protection Focus • Luzon & Online",
        profileUrl: "", // Paste DashNex URL here once ready
        viberUrl: "viber://chat?number=%2B639170000002",
        whatsappUrl: "https://wa.me/639170000002",
        messengerUrl: "https://m.me/",
        bookingUrl: "https://calendly.com/"
      },
      {
        slug: "clarissa-mendoza",
        initials: "CM",
        name: "Clarissa Mendoza",
        role: "Financial Coach for Young Professionals & Families",
        verified: true,
        recommended: false,
        priorityScore: 86,
        specialties: ["health-hmo", "education", "retirement"],
        clientTypes: ["young-pro", "parents", "ofw"],
        style: "budget-first",
        bio: "Guides first-time policy owners and young families step-by-step on separating emergency funds, critical illness cover, and college funds.",
        credentials: "IC-Licensed Advisor • Budget-First Planning • Visayas, Mindanao & Online",
        profileUrl: "", // Paste DashNex URL here once ready
        viberUrl: "viber://chat?number=%2B639170000003",
        whatsappUrl: "https://wa.me/639170000003",
        messengerUrl: "https://m.me/",
        bookingUrl: "https://calendly.com/"
      }
    ];

    const QUESTIONS = [
      {
        key: "goal",
        title: "Ano ang #1 financial priority mo ngayon?",
        sub: "Piliin ang pinaka-importante sa pamilya mo sa ngayon.",
        options: [
          { value: "income-protection", label: "Income Protection ng Pamilya", desc: "Siguradong tuloy ang bills at gastusin kahit may mangyari sa breadwinner" },
          { value: "health-hmo", label: "Critical Illness & Hospital Backup", desc: "Dagdag proteksyon bukod sa company HMO para hindi maubos ang ipon" },
          { value: "education", label: "College & Education Fund ng Anak", desc: "Siguradong makakapagtapos ang mga anak anuman ang mangyari" },
          { value: "estate-tax", label: "Asset & Estate Tax Protection", desc: "Proteksyon sa naipundar na lupa, bahay, at bank accounts (TRAIN Law)" }
        ]
      },
      {
        key: "profile",
        title: "Alin ang pinaka-naglalarawan sa sitwasyon mo?",
        sub: "Para ma-match ka sa advisor na sanay sa setup mo.",
        options: [
          { value: "breadwinner", label: "Family Breadwinner", desc: "May sinusuportahang pamilya o magulang buwan-buwan" },
          { value: "parents", label: "Young Parent / Married", desc: "Nagsisimula o nagpapalaki ng pamilya" },
          { value: "ofw", label: "OFW / Seafarer / Remote Earner", desc: "Nagtatrabaho abroad o kumikita para sa pamilya sa Pilipinas" },
          { value: "business-owner", label: "Business Owner / Self-Employed", desc: "Walang company HMO at gustong protektahan ang naipundar" }
        ]
      },
      {
        key: "style",
        title: "Paano mo gustong makipag-usap sa advisor?",
        sub: "Walang hard-selling—piliin ang komportable para sa iyo.",
        options: [
          { value: "educational", label: "Step-by-step & Madaling Intindihin", desc: "Gusto ko munang maintindihan ang options bago magdesisyon" },
          { value: "budget-first", label: "Budget-First & Practical", desc: "Gusto ko ng computation na pasok lang sa komportableng monthly budget" },
          { value: "analytical", label: "Numbers & Detailed Comparison", desc: "Gusto kong makita ang eksaktong breakdown at coverage figures" }
        ]
      },
      {
        key: "timeline",
        title: "Kailan mo balak magsimula o magpa-compute?",
        sub: "Para mabigyan ka ng tamang priority.",
        options: [
          { value: "now", label: "Ngayong linggo / Ngayong buwan", desc: "Gusto ko nang makita ang eksaktong numbers ko" },
          { value: "exploring", label: "Nagre-research at nagco-compare pa", desc: "Gusto ko munang subukan ang 30-second Safety Net Check" }
        ]
      }
    ];

    let step = 0;
    const answers = {};

    const quizBox = document.getElementById("quiz-box");
    const resultsBox = document.getElementById("results-box");
    const stepLabel = document.getElementById("step-label");
    const stepPct = document.getElementById("step-pct");
    const progressFill = document.getElementById("progress-fill");
    const qTitle = document.getElementById("q-title");
    const qSub = document.getElementById("q-sub");
    const optionsBox = document.getElementById("options-box");
    const backBtn = document.getElementById("back-btn");
    const skipBtn = document.getElementById("skip-btn");
    const retakeBtn = document.getElementById("retake-btn");
    const advisorList = document.getElementById("advisor-list");
    const matchSummary = document.getElementById("match-summary");
    const modal = document.getElementById("profile-modal");
    const modalBody = document.getElementById("modal-body");
    const modalClose = document.getElementById("modal-close");

    function renderQuestion() {
      const q = QUESTIONS[step];
      const pct = Math.round(((step + 1) / QUESTIONS.length) * 100);
      stepLabel.textContent = `Question ${step + 1} of ${QUESTIONS.length}`;
      stepPct.textContent = `${pct}%`;
      progressFill.style.width = `${pct}%`;
      qTitle.textContent = q.title;
      qSub.textContent = q.sub;
      backBtn.classList.toggle("hidden", step === 0);

      optionsBox.innerHTML = "";
      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn";
        btn.innerHTML = `<div>${opt.label}<small>${opt.desc}</small></div><span>→</span>`;
        btn.addEventListener("click", () => {
          answers[q.key] = opt.value;
          if (step < QUESTIONS.length - 1) {
            step += 1;
            renderQuestion();
          } else {
            showResults();
          }
        });
        optionsBox.appendChild(btn);
      });
    }

    function buildCalculatorLink(adv) {
      const params = new URLSearchParams();
      params.set("advisor", adv.slug);
      params.set("advisor_name", adv.name);
      if (answers.goal) params.set("goal", answers.goal);
      return `/calculator.html?${params.toString()}`;
    }

    function buildProfileRedirect(adv) {
      const url = new URL(adv.profileUrl, window.location.origin);
      url.searchParams.set("advisor", adv.slug);
      if (answers.goal) url.searchParams.set("goal", answers.goal);
      return url.toString();
    }

    function openAdvisorModal(adv) {
      const calcHref = buildCalculatorLink(adv);
      modalBody.innerHTML = `
        <div class="badges">
          ${adv.recommended ? '<span class="badge badge-rec">★ Recommended Match</span>' : ''}
          ${adv.verified ? '<span class="badge badge-ver">✓ Verified Advisor</span>' : ''}
        </div>
        <div class="adv-main">
          <div class="avatar">${adv.initials}</div>
          <div class="adv-info">
            <h3>${adv.name}</h3>
            <div class="adv-role">${adv.role}</div>
          </div>
        </div>
        <p class="adv-bio" style="margin-top:12px;">${adv.bio}</p>
        <div class="modal-section">
          <h4>Credentials & Coverage</h4>
          <p style="font-size:13px;color:var(--slate);">${adv.credentials}</p>
        </div>
        <div class="modal-section">
          <h4>Connect Directly With ${adv.name.split(" ")[0]}</h4>
          <div class="cta-grid">
            <a class="cta-link cta-calc" href="${calcHref}">📊 Run 30-Sec Safety Net Check With ${adv.name.split(" ")[0]} →</a>
            <a class="cta-link" href="${adv.viberUrl}" target="_blank" rel="noopener">💬 Viber</a>
            <a class="cta-link" href="${adv.whatsappUrl}" target="_blank" rel="noopener">📱 WhatsApp</a>
            <a class="cta-link" href="${adv.messengerUrl}" target="_blank" rel="noopener">✉️ Messenger</a>
            <a class="cta-link" href="${adv.bookingUrl}" target="_blank" rel="noopener">📅 Book 15-Min Call</a>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
    }

    function showResults() {
      quizBox.classList.add("hidden");
      resultsBox.classList.remove("hidden");

      const scored = ADVISORS.map((adv) => {
        let score = adv.priorityScore;
        if (answers.goal && adv.specialties.includes(answers.goal)) score += 25;
        if (answers.profile && adv.clientTypes.includes(answers.profile)) score += 20;
        if (answers.style && adv.style === answers.style) score += 15;
        return { ...adv, totalScore: score };
      }).sort((a, b) => b.totalScore - a.totalScore);

      matchSummary.textContent = answers.goal
        ? "Ranked based on your selected family priority and preferred consultation style."
        : "Showing verified Philippine financial advisors.";

      advisorList.innerHTML = "";
      scored.forEach((adv, idx) => {
        const card = document.createElement("div");
        card.className = `adv-card ${idx === 0 ? "top-pick" : ""}`;
        const hasLiveDashNex = adv.profileUrl && /^https?:\/\//i.test(adv.profileUrl.trim());
        const calcHref = buildCalculatorLink(adv);

        card.innerHTML = `
          <div class="badges">
            ${adv.recommended ? '<span class="badge badge-rec">★ Recommended</span>' : ''}
            ${adv.verified ? '<span class="badge badge-ver">✓ Verified</span>' : ''}
          </div>
          <div class="adv-main">
            <div class="avatar">${adv.initials}</div>
            <div class="adv-info">
              <h3>${adv.name}</h3>
              <div class="adv-role">${adv.role}</div>
              <p class="adv-bio">${adv.bio}</p>
              <div class="tags">
                ${adv.specialties.map((s) => `<span class="tag">#${s}</span>`).join("")}
              </div>
              <div class="card-actions">
                <button type="button" class="btn-primary view-profile-btn">View Full Profile & Connect →</button>
                <a class="btn-secondary" href="${calcHref}">30-Sec Safety Net Check</a>
              </div>
            </div>
          </div>
        `;

        const viewBtn = card.querySelector(".view-profile-btn");
        viewBtn.addEventListener("click", () => {
          if (hasLiveDashNex) {
            window.location.href = buildProfileRedirect(adv);
          } else {
            openAdvisorModal(adv);
          }
        });

        advisorList.appendChild(card);
      });
    }

    backBtn.addEventListener("click", () => {
      if (step > 0) { step -= 1; renderQuestion(); }
    });
    skipBtn.addEventListener("click", showResults);
    retakeBtn.addEventListener("click", () => {
      step = 0;
      Object.keys(answers).forEach((k) => delete answers[k]);
      resultsBox.classList.add("hidden");
      quizBox.classList.remove("hidden");
      renderQuestion();
    });
    modalClose.addEventListener("click", () => modal.classList.add("hidden"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });

    renderQuestion();
  </script>
</body>
</html>
